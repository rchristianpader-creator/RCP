<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0d0c">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=161">
<link rel="apple-touch-icon" href="/icon-180.png?v=161">
<title>Positionen · Aktien-Liste</title>
<style>
  :root {
    /* Dieselben Marken wie in der Liste — Wort fuer Wort. Die Verwaltung
       war als einzige Seite noch hell: weisse Kaesten auf Grauweiss,
       waehrend die Liste, die Anmeldung und der Ladebildschirm dunkles Glas
       auf wanderndem Licht zeigen. Wer aus der Liste hierher kam, kam in
       eine andere App.

       Umgestellt sind nur diese Marken und ein paar Flaechen darunter. Der
       Rest der Seite hat schon immer ueber --fg, --muted, --line und
       --card gearbeitet und zieht deshalb von selbst mit. */
    color-scheme: dark;
    --bg: #0a0d0c;
    --bg-rgb: 10, 13, 12;
    --fg: #f2f5f4;
    --fg-rgb: 242, 245, 244;
    --auf-fg: #0a0d0c;
    --muted: #9aa5a2;
    --line: rgba(255, 255, 255, 0.16);
    --soft: rgba(255, 255, 255, 0.06);
    --card: #131816;
    --hair: rgba(255, 255, 255, 0.12);
    --r-karte: 16px;
    --r-feld: 12px;
    --r-chip: 11px;
    --r-marke: 6px;
    /* Die Farbe der gezeichneten Fetch.ai-Marke — dieselben drei Werte auf
       jeder Seite, stil-test haelt sie zusammen. Gebraucht werden sie hier
       nicht unmittelbar; sie stehen da, damit es EINE Antwort auf die
       Frage gibt, welche Farbe die Marke hat. */
    --marke-hell: #3c2fa8;
    --marke-mitte: #241b78;
    --marke-tief: #141051;
    /* Der Grund: dieselben vier Farbfelder wie drueben, darueber die drei
       wandernden Lichtfelder. Ohne ihn waere das Glas darauf nur graue
       Fuellung — es braucht etwas, das hindurchscheint. */
    --grund-kuehl: rgba(38, 74, 96, 0.05);
    --grund-warm: rgba(112, 82, 52, 0.04);
    --grund-flieder: rgba(64, 44, 78, 0.045);
    --grund-tuerkis: rgba(28, 88, 78, 0.05);
    --grund-flaeche:
      radial-gradient(120% 90% at 50% 50%, transparent 40%, rgba(0, 0, 0, 0.55) 100%),
      radial-gradient(78% 58% at 10% 4%, var(--grund-kuehl) 0%, transparent 68%),
      radial-gradient(66% 52% at 92% 14%, var(--grund-warm) 0%, transparent 68%),
      radial-gradient(84% 62% at 74% 96%, var(--grund-flieder) 0%, transparent 70%),
      radial-gradient(64% 48% at 8% 88%, var(--grund-tuerkis) 0%, transparent 70%),
      var(--bg);
    /* Glas. Die Kaesten hier scrollen mit, deshalb kein Frost — ein
       mitscrollender backdrop-filter wird bei jedem Bild neu gefiltert und
       hat drueben schon einmal das Scrollen traege gemacht. Was ein Fenster
       ausmacht, ist ohnehin die Kante, nicht die Fuellung. */
    --glas-fenster: transparent;
    --glas-kante-glanz:
      inset 0 1px 0 rgba(255, 255, 255, 0.36),
      inset 0 2px 1px -1px rgba(255, 255, 255, 0.12),
      inset 1px 0 0 rgba(255, 255, 255, 0.08),
      inset -1px 0 0 rgba(255, 255, 255, 0.05),
      inset 0 -1px 0 rgba(0, 0, 0, 0.34);
    --hebung:
      0 1px 2px rgba(0, 0, 0, 0.4),
      0 10px 24px -12px rgba(0, 0, 0, 0.6);
    --glas: rgba(255, 255, 255, 0.1);
    --gut: #3ecf8e;
    --schlecht: #ff6b6b;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    /* Oben der sichere Rand, wie in der Verwaltung: hier faengt gleich der
       Kopf an. Unten bleibt Platz fuer die feste Leiste. */
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: 100px;
  }
  /* DER GRUND — dieselbe Flaeche wie in der Liste.

     Fest hinter allem, nicht am Body: die Lichtfelder ragen absichtlich
     ueber den Rand hinaus, damit nie eine Kante ins Bild kommt, und ohne
     overflow bekaeme die Seite dadurch eine Rollflaeche, die niemand haben
     will. */
  .grundkurve {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    overflow: hidden;
    background: var(--grund-flaeche);
  }
  .lichtfeld {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    will-change: transform;
  }
  /* Groesser als der Schirm und ausserhalb beginnend; teilerfremde
     Umlaufzeiten, damit nie wieder dasselbe Bild dasteht; keine Deckkraft
     an einer bewegten Ebene, die Schwaeche steckt in der Farbe. Alles wie
     drueben — die Begruendungen stehen dort ausfuehrlich. */
  .lichtfeld.eins {
    left: -60%; top: -45%; width: 150%; height: 105%;
    background: radial-gradient(closest-side,
      rgba(64, 108, 138, 0.2) 0%, rgba(64, 108, 138, 0.07) 46%, rgba(64, 108, 138, 0) 72%);
    animation: feldEins 73s ease-in-out infinite alternate;
  }
  .lichtfeld.zwei {
    right: -55%; top: 8%; width: 135%; height: 90%;
    background: radial-gradient(closest-side,
      rgba(126, 96, 62, 0.17) 0%, rgba(126, 96, 62, 0.06) 46%, rgba(126, 96, 62, 0) 72%);
    animation: feldZwei 101s ease-in-out infinite alternate;
  }
  .lichtfeld.drei {
    left: -35%; bottom: -50%; width: 160%; height: 100%;
    background: radial-gradient(closest-side,
      rgba(78, 62, 104, 0.18) 0%, rgba(78, 62, 104, 0.06) 46%, rgba(78, 62, 104, 0) 72%);
    animation: feldDrei 139s ease-in-out infinite alternate;
  }
  @keyframes feldEins {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(38%, 26%, 0); }
  }
  @keyframes feldZwei {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(-30%, 34%, 0); }
  }
  @keyframes feldDrei {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(26%, -40%, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .lichtfeld { animation: none; }
  }

  /* Der Streifen hinter der Statuszeile — wie in der Liste, aus demselben
     Grund: mit viewport-fit=cover laeuft die Seite unter die Uhr. */
  .statusdecke {
    position: fixed;
    left: 0;
    right: 0;
    top: 0;
    height: env(safe-area-inset-top, 0px);
    z-index: 50;
    pointer-events: none;
    background: linear-gradient(to bottom,
      rgba(var(--bg-rgb), 0.98) 0%,
      rgba(var(--bg-rgb), 0.96) 62%,
      rgba(var(--bg-rgb), 0) 100%);
  }

  @keyframes riseIn {
    from { opacity: 0; transform: translate3d(0, 10px, 0); }
    to   { opacity: 1; transform: translate3d(0, 0, 0); }
  }

  header {
    position: relative;
    /* Ein Fenster wie in der Liste und in der Verwaltung, keine Platte. */
    max-width: 612px;
    margin: 14px auto;
    padding: 34px 24px 24px;
    text-align: center;
    background: var(--glas-fenster);
    border: 1px solid var(--line);
    border-radius: var(--r-karte);
    box-shadow: var(--glas-kante-glanz), var(--hebung);
  }
  @media (max-width: 640px) {
    header { margin: 14px; }
  }
  header .zurueck {
    position: absolute;
    top: 14px;
    left: 14px;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--muted);
    text-decoration: none;
    padding: 6px 10px 6px 4px;
    -webkit-tap-highlight-color: transparent;
  }
  header .zurueck::before { content: "‹"; margin-right: 5px; font-size: 14px; }
  header .label {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 10px;
  }
  header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
  header .sub { font-size: 13px; color: var(--muted); margin-top: 6px; }

  /* Die Marke: dieselben vier Kerzen wie im Kopf der Liste, in derselben
     Geometrie (logo.py), zwei davon hohl. Sie wogen weiter — der Kopf ist
     hier kleiner, also wogen sie kleiner. */
  .kopf-marke {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 4px;
  }
  .marke-kerzen {
    flex: 0 0 auto;
    width: 40px;
    height: 35px;
    overflow: visible;
    fill: var(--fg);
  }
  .marke-kerzen .hohl { fill: none; stroke: var(--fg); stroke-width: 18; }
  .marke-kerzen .kerze {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    will-change: transform;
  }
  .marke-kerzen .k1 { animation: kerzeWoge 5.2s ease-in-out -0.0s infinite alternate; }
  .marke-kerzen .k2 { animation: kerzeWoge 5.8s ease-in-out -1.3s infinite alternate; }
  .marke-kerzen .k3 { animation: kerzeWoge 6.4s ease-in-out -2.6s infinite alternate; }
  .marke-kerzen .k4 { animation: kerzeWoge 7.0s ease-in-out -3.9s infinite alternate; }
  @keyframes kerzeWoge {
    from { transform: translateY(-38px) scaleY(1.18); }
    to   { transform: translateY(38px) scaleY(0.85); }
  }
  @media (prefers-reduced-motion: reduce) {
    .marke-kerzen .kerze { animation: none; }
  }
  header .zurueck {
    position: absolute;
    top: 14px;
    left: 14px;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--muted);
    text-decoration: none;
    padding: 6px 10px 6px 4px;
    -webkit-tap-highlight-color: transparent;
  }
  header .zurueck::before { content: "‹"; margin-right: 5px; font-size: 14px; }
  header .label {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 10px;
  }
  header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
  header .sub { font-size: 13px; color: var(--muted); margin-top: 6px; }

  main { max-width: 640px; margin: 0 auto; padding: 8px 14px 0; }

  /* Jede Position ist ein Fenster — dieselbe Machart wie die Karten in
     der Liste: durchsichtig, mit Kante, Lichtrand und Hebung. */
  .pos {
    background: var(--glas-fenster);
    box-shadow: var(--glas-kante-glanz), var(--hebung);
    border: 1px solid var(--line);
    border-radius: var(--r-karte);
    margin-bottom: 10px;
    animation: riseIn 0.47s var(--ease) both;
    box-shadow: var(--hebung);
  }
  .pos.offen { border-color: var(--fg); }

  .kopf {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 14px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .kopf .griff {
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    min-width: 18px;
  }
  .kopf .marke {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
    border: 1px solid var(--line);
    border-radius: var(--r-marke);
    padding: 3px 7px;
  }
  .kopf .wie { flex: 1; font-size: 14px; font-weight: 600; }
  .kopf .neu {
    font-size: 9px;
    letter-spacing: 0.14em;
    font-weight: 700;
    color: var(--auf-fg);
    background: var(--fg);
    border-radius: var(--r-marke);
    padding: 2px 5px;
    white-space: nowrap;
  }
  /* Ueberarbeitet ist leiser als neu — grau statt schwarz, wie in der Liste */
  .kopf .neu.update { background: var(--muted); letter-spacing: 0.08em; }
  /* Nicht gefuellt, sondern umrandet: es ist kein Zustand der Position,
     sondern eine Einschraenkung ihrer Sichtbarkeit. */
  .kopf .neu.nurchef {
    background: none;
    color: var(--fg);
    border: 1px solid var(--fg);
    letter-spacing: 0.08em;
  }
  .kopf .pfeil { color: var(--muted); font-size: 13px; transition: transform 0.27s var(--ease); }
  .pos.offen .kopf .pfeil { transform: rotate(90deg); }

  .felder { display: none; padding: 0 14px 14px; border-top: 1px solid var(--hair); }
  .pos.offen .felder { display: block; }

  label.f { display: block; margin-top: 12px; }
  label.f > span {
    display: block;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 5px;
  }
  label.f input {
    width: 100%;
    font: inherit;
    font-size: 16px; /* unter 16px zoomt Safari beim Tippen */
    color: var(--fg);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-feld);
    padding: 9px 11px;
    transition: border-color 0.27s ease;
  }
  label.f input:focus { outline: none; border-color: var(--fg); }
  label.f .hilfe { font-size: 11px; color: var(--muted); margin-top: 4px; text-transform: none; letter-spacing: 0; font-weight: 400; }

  .zwei { display: flex; gap: 10px; }
  .zwei > label.f { flex: 1; }

  .schalter {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-top: 14px;
    font-size: 13px;
    color: var(--fg);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .schalter input { width: 17px; height: 17px; accent-color: var(--fg); }

  .werkzeug { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .werkzeug button, .knopf {
    font: inherit;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--fg);
    background: var(--glas-fenster);
    box-shadow: var(--glas-kante-glanz);
    border: 1px solid var(--line);
    border-radius: var(--r-feld);
    padding: 8px 12px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transform: translateZ(0);
    transition: background 0.24s ease, border-color 0.24s ease, transform 0.16s var(--ease);
  }
  .werkzeug button:active, .knopf:active { transform: scale(0.96); }
  .werkzeug button.rot { color: var(--schlecht); border-color: var(--schlecht); }
  .werkzeug button[disabled] { opacity: 0.35; cursor: default; }

  .neuKnopf {
    display: block;
    width: 100%;
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--fg);
    background: var(--glas-fenster);
    border: 1px dashed var(--line);
    border-radius: var(--r-marke);
    padding: 14px;
    margin-top: 6px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .neuKnopf:active { background: var(--soft); }

  .leiste {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 50;
    /* Die einzige Flaeche der App, die stehen bleibt statt mitzuscrollen
       — also die einzige, die Frost tragen darf. Weiss stand hier fest im
       Text und blieb beim Umstellen weiss. */
    background: rgba(var(--bg-rgb), 0.82);
    -webkit-backdrop-filter: saturate(190%) blur(12px);
    backdrop-filter: saturate(190%) blur(12px);
    border-top: 1px solid var(--line);
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px));
  }
  .leiste .innen {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .leiste .stand { flex: 1; font-size: 12px; color: var(--muted); }
  .leiste .wahl {
    flex: none;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  .leiste .wahl input {
    width: 17px;
    height: 17px;
    accent-color: var(--fg);
    cursor: pointer;
  }
  .leiste .wahl:has(input:checked) { color: var(--fg); }
  .leiste .stand.schlecht { color: var(--schlecht); }
  .leiste .stand.gut { color: var(--gut); }
  .leiste button {
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--auf-fg);
    background: var(--fg);
    border: 1px solid var(--fg);
    border-radius: var(--r-feld);
    padding: 12px 20px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transform: translateZ(0);
    transition: opacity 0.27s ease, transform 0.16s var(--ease);
  }
  .leiste button:active { transform: scale(0.98); }
  .leiste button[disabled] { opacity: 0.35; cursor: default; }

  @media (prefers-reduced-motion: reduce) {
    .pos { animation: none; }
    * { transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<div class="grundkurve" aria-hidden="true">
  <i class="lichtfeld eins"></i><i class="lichtfeld zwei"></i><i class="lichtfeld drei"></i>
</div>
<div class="statusdecke" aria-hidden="true"></div>

<header>
  <a class="zurueck" href="/verwaltung.html">Verwaltung</a>
  <div class="label">Watchlist</div>
  <div class="kopf-marke">
    <svg class="marke-kerzen" viewBox="80 90 352 308" aria-hidden="true">
      <g class="kerze k1">
        <rect x="109" y="128" width="24" height="154" rx="12"/>
        <rect x="88" y="172" width="66" height="80" rx="9"/>
      </g>
      <g class="kerze k2">
        <rect x="199" y="228" width="24" height="160" rx="12"/>
        <rect x="178" y="252" width="66" height="90" rx="9"/>
      </g>
      <g class="kerze k3">
        <rect x="289" y="310" width="24" height="74" rx="12"/>
        <rect class="hohl" x="277" y="259" width="48" height="74" rx="7"/>
      </g>
      <g class="kerze k4">
        <rect x="379" y="98" width="24" height="186" rx="12"/>
        <rect class="hohl" x="367" y="133" width="48" height="108" rx="7"/>
      </g>
    </svg>
    <h1>Positionen</h1>
  </div>
  <p class="sub" id="untertitel">wird geladen …</p>
</header>

<main>
  <div id="liste"></div>
  <button type="button" class="neuKnopf" id="neuKnopf">Position hinzufügen</button>
</main>

<div class="leiste">
  <div class="innen">
    <div class="stand" id="stand">unverändert</div>
    <!-- Nicht jede Änderung ist eine Nachricht wert: ein Tippfehler in der
         Branche, eine andere Reihenfolge. Der Haken bleibt gesetzt, damit
         Zonen und Ziele weiterhin von selbst herausgehen — abwählen muss
         man ausdrücklich. -->
    <label class="wahl"><input type="checkbox" id="melden" checked> Melden</label>
    <button type="button" id="speichern" disabled>Speichern</button>
  </div>
</div>

<script>
(function () {
  var API = "/.netlify/functions/positionen";
  var liste = document.getElementById("liste");
  var stand = document.getElementById("stand");
  var speichern = document.getElementById("speichern");
  var untertitel = document.getElementById("untertitel");

  var daten = [];
  var start = "";

  var FELDER = [
    { k: "name", t: "Name", h: "So steht es über der Karte, z. B. Intel Corporation" },
    { k: "badge", t: "Kürzel auf der Karte", h: "Rechts oben in der Karte, z. B. INTC" },
    { k: "chip", t: "Beschriftung im Menü", h: "Der Knopf oben, oft dasselbe Kürzel — bei Gold steht dort Gold" },
    { k: "branche", t: "Branche", h: "Kleine Zeile unter dem Namen" },
    { k: "zone", t: "Einkaufszone", h: "Zwei Zahlen, z. B. 50,12 – 39,19 USD — daraus kommt der Alarm" },
    { k: "ziel", t: "Ziel", h: "z. B. 295,75 USD" },
    { k: "tv", t: "TradingView-Symbol", h: "Börse und Kürzel, z. B. NASDAQ:INTC — daraus wird der Chart" },
    { k: "yahoo", t: "Yahoo-Symbol", h: "Für Kurse und Alarme, z. B. INTC, BTC-USD, GC=F" },
    { k: "frage", t: "Suchbegriff für News", h: "z. B. Intel Aktie — leer lassen heißt keine News" },
    { k: "fn", t: "finanzen.net-Seite", h: "Vollständige https-Adresse, optional" },
    { k: "fibo", t: "Analyse-Chart", h: "Dein gespeicherter TradingView-Chart, optional" },
    { k: "logo", t: "Logo-Adresse", h: "Optional. Leer lassen: dann wird das Logo automatisch gesucht — https-Adresse eines Bildes" },
    { k: "id", t: "Anker", h: "Kleinbuchstaben, wird in der Adresse benutzt (#intc) — später nicht mehr ändern" }
  ];

  function sagen(text, art) {
    stand.textContent = text;
    stand.className = "stand" + (art ? " " + art : "");
  }

  function verglichen() {
    // Ohne die Anzeigefelder (_offen) — Aufklappen ist keine Aenderung
    var jetzt = JSON.stringify(fuerServer());
    var anders = jetzt !== start;
    speichern.disabled = !anders;
    if (anders) sagen(daten.length + " Positionen · nicht gespeichert");
    else sagen(daten.length + " Positionen · unverändert");
    return anders;
  }

  function el(tag, klasse, text) {
    var n = document.createElement(tag);
    if (klasse) n.className = klasse;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function feld(p, f) {
    var l = el("label", "f");
    l.appendChild(el("span", null, f.t));
    var i = document.createElement("input");
    i.type = "text";
    i.value = p[f.k] || "";
    i.autocapitalize = f.k === "id" || f.k === "tv" ? "none" : "sentences";
    i.autocomplete = "off";
    i.spellcheck = false;
    i.addEventListener("input", function () {
      p[f.k] = i.value;
      if (f.k === "name" || f.k === "badge") zeichnen();
      else verglichen();
    });
    l.appendChild(i);
    if (f.h) l.appendChild(el("div", "hilfe", f.h));
    return l;
  }

  function karte(p, i) {
    var d = el("div", "pos" + (p._offen ? " offen" : ""));

    var kopf = el("div", "kopf");
    kopf.appendChild(el("span", "griff", (i + 1) + "."));
    kopf.appendChild(el("span", "marke", p.badge || "?"));
    kopf.appendChild(el("span", "wie", p.name || "Ohne Namen"));
    if (p.neu) kopf.appendChild(el("span", "neu", "NEU"));
    else if (p.update) kopf.appendChild(el("span", "neu update", "UPDATE"));
    /* Zugeklappt sieht man sonst nicht, dass diese Position nur hier steht
       — und genau das ist die Angabe, bei der ein Irrtum weh taete. */
    if (p.nurchef) kopf.appendChild(el("span", "neu nurchef", "NUR HIER"));
    kopf.appendChild(el("span", "pfeil", "›"));
    kopf.addEventListener("click", function () {
      p._offen = !p._offen;
      zeichnen();
    });
    d.appendChild(kopf);

    var felder = el("div", "felder");

    FELDER.forEach(function (f) { felder.appendChild(feld(p, f)); });

    /* Zwei Kennzeichen fuers Menue. Beide gleichzeitig ergaeben keinen Sinn —
       was gerade erst dazugekommen ist, ist nicht auch schon ueberarbeitet.
       Deshalb schaltet das eine das andere aus. */
    function schalter(feldName, text, allein) {
      var s = el("label", "schalter");
      var c = document.createElement("input");
      c.type = "checkbox";
      c.checked = p[feldName] === true;
      c.addEventListener("change", function () {
        p[feldName] = c.checked;
        /* NEU und UPDATE schliessen einander aus. "Nur hier" nicht — es
           sagt etwas ueber die Sichtbarkeit, nicht ueber den Zustand, und
           eine neue Position darf sehr wohl zuerst nur hier stehen. */
        if (c.checked && !allein) p[feldName === "neu" ? "update" : "neu"] = false;
        zeichnen();
      });
      s.appendChild(c);
      s.appendChild(el("span", null, text));
      felder.appendChild(s);
    }
    schalter("neu", "Im Menü als NEU markieren");
    schalter("update", "Im Menü als UPDATE markieren — überarbeitet");
    schalter("nurchef", "Nur für die Verwaltung — andere sehen sie nicht, "
      + "sie meldet sich nicht und steht in keinem Statusabruf", true);

    var w = el("div", "werkzeug");

    var hoch = el("button", null, "Nach oben");
    hoch.type = "button";
    hoch.disabled = i === 0;
    hoch.addEventListener("click", function () {
      daten.splice(i - 1, 0, daten.splice(i, 1)[0]);
      zeichnen();
    });
    w.appendChild(hoch);

    var runter = el("button", null, "Nach unten");
    runter.type = "button";
    runter.disabled = i === daten.length - 1;
    runter.addEventListener("click", function () {
      daten.splice(i + 1, 0, daten.splice(i, 1)[0]);
      zeichnen();
    });
    w.appendChild(runter);

    var weg = el("button", "rot", "Entfernen");
    weg.type = "button";
    weg.addEventListener("click", function () {
      if (!confirm("„" + (p.name || p.badge) + "“ aus der Liste nehmen?")) return;
      daten.splice(i, 1);
      zeichnen();
    });
    w.appendChild(weg);

    felder.appendChild(w);
    d.appendChild(felder);
    return d;
  }

  function zeichnen() {
    liste.textContent = "";
    daten.forEach(function (p, i) { liste.appendChild(karte(p, i)); });
    untertitel.textContent = daten.length === 1 ? "1 Position" : daten.length + " Positionen";
    verglichen();
  }

  function sauber(p) {
    var raus = {};
    Object.keys(p).forEach(function (k) { if (k.charAt(0) !== "_") raus[k] = p[k]; });
    return raus;
  }

  function fuerServer() {
    return daten.map(sauber);
  }

  document.getElementById("neuKnopf").addEventListener("click", function () {
    daten.push({
      id: "", name: "", badge: "", chip: "", neu: true, update: false, nurchef: false, branche: "",
      zone: "", ziel: "", tv: "", yahoo: "", frage: "", fn: "", keys: "", fibo: "",
      logo: "",
      _offen: true
    });
    zeichnen();
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  });

  speichern.addEventListener("click", function () {
    speichern.disabled = true;
    var vorher = speichern.textContent;
    speichern.textContent = "Speichert …";

    fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({
        positionen: fuerServer(),
        // false heisst: still speichern, kein Push und kein Eintrag im Buch
        melden: document.getElementById("melden").checked
      })
    })
      .then(function (r) { return r.json().catch(function () { return {}; }); })
      .then(function (a) {
        speichern.textContent = vorher;
        if (!a || !a.ok) {
          sagen((a && a.fehler) || "Das hat nicht geklappt.", "schlecht");
          speichern.disabled = false;
          return;
        }
        start = JSON.stringify(fuerServer());
        speichern.disabled = true;
        sagen(
          "Gespeichert." +
            (a.neu && a.neu.length ? " Neu: " + a.neu.join(" · ") : "") +
            (a.geaendert && a.geaendert.length
              ? " Geändert: " + a.geaendert.join(" · ") : "") +
            (a.ueberarbeitet && a.ueberarbeitet.length
              ? " Überarbeitet: " + a.ueberarbeitet.join(" · ") : "") +
            (a.gemeldet ? " · an " + a.gemeldet + " Geräte gemeldet"
                        : (document.getElementById("melden").checked ? "" : " · still")),
          "gut"
        );
      })
      .catch(function () {
        speichern.textContent = vorher;
        speichern.disabled = false;
        sagen("Keine Verbindung.", "schlecht");
      });
  });

  window.addEventListener("beforeunload", function (e) {
    if (JSON.stringify(fuerServer()) !== start) {
      e.preventDefault();
      e.returnValue = "";
    }
  });

  fetch(API, { credentials: "same-origin", cache: "no-store" })
    .then(function (r) {
      if (r.status === 401) { location.replace("/anmelden.html?ziel=%2Fpositionen.html"); return null; }
      return r.json();
    })
    .then(function (a) {
      if (!a) return;
      if (!a.ok) { sagen(a.fehler || "Das hat nicht geklappt.", "schlecht"); return; }
      daten = a.positionen;
      start = JSON.stringify(fuerServer());
      zeichnen();
    })
    .catch(function () { sagen("Keine Verbindung.", "schlecht"); });
})();
</script>
<script src="/besuch.js" defer></script>
</body>
</html>
