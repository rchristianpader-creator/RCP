<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nicht gefunden · Aktien-Liste</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, Arial, sans-serif;
    background: #fafafa;
    color: #111;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
  }
  .box { text-align: center; max-width: 320px; }
  .label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #737373;
  }
  h1 { margin-top: 14px; font-size: 26px; font-weight: 700; letter-spacing: -0.3px; }
  p { margin-top: 10px; font-size: 13px; color: #737373; line-height: 1.5; }
  .rule { width: 28px; height: 1px; background: #111; opacity: 0.3; margin: 20px auto; }
  a {
    display: inline-block;
    padding: 11px 18px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #111;
    text-decoration: none;
    border: 1px solid #111;
    border-radius: 2px;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="label">Aktien-Liste</div>
    <h1>Nicht gefunden</h1>
    <p>Diese Adresse gibt es hier nicht.</p>
    <div class="rule"></div>
    <a href="/">Zur Liste</a>
  </div>
</body>
</html>
