<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#fafafa">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=72">
<link rel="apple-touch-icon" href="/icon-180.png?v=72">
<title>Anmelden · Aktien-Liste</title>

<!-- Die Vorschau beim Verschicken entsteht hier, nicht auf der Liste.
     Wer die Adresse in WhatsApp oder iMessage schickt, schickt einen Roboter
     los, und der hat keine Anmeldung: das Tor leitet ihn auf diese Seite
     weiter. Stehen die Angaben nur auf index.html, sieht er sie nie — dann
     kommt die nackte Adresse ohne Bild an. Das Bild selbst ist ohne
     Anmeldung erreichbar (OFFEN_ANFANG in tor.js).
     Die Nummer am Bild muss hoch, sonst zeigen die Dienste ihre alte Kopie. -->
<meta name="description" content="Aktien-Liste · Live-Charts und technische Analyse. Geschützt — Zugang auf Anfrage.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Aktien-Liste">
<meta property="og:url" content="https://rcp-aktien.netlify.app/">
<meta property="og:title" content="Aktien-Liste · Ralph Christian Pader">
<meta property="og:description" content="Live-Charts · Technische Analyse · Geschützt, Zugang auf Anfrage">
<meta property="og:image" content="https://rcp-aktien.netlify.app/og-preview.png?v=72">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Aktien-Liste — Watchlist mit Live-Charts">
<meta property="og:locale" content="de_DE">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Aktien-Liste · Ralph Christian Pader">
<meta name="twitter:description" content="Live-Charts · Technische Analyse · Geschützt, Zugang auf Anfrage">
<meta name="twitter:image" content="https://rcp-aktien.netlify.app/og-preview.png?v=72">
<style>
  :root {
    color-scheme: light;
    --bg: #fafafa;
    --fg: #111111;
    --muted: #737373;
    --line: #e5e5e5;
    --soft: #f5f5f5;
    --card: #ffffff;
    --hair: #ebebeb;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  @keyframes riseIn {
    from { opacity: 0; transform: translate3d(0, 10px, 0); }
    to   { opacity: 1; transform: translate3d(0, 0, 0); }
  }

  /* LAUFENDE KURSKERZEN
     Der Hintergrund ist ein Kursverlauf, der durchs Bild zieht. Kein Zierrat:
     das Feld ist zweimal derselbe Weg hintereinander, deshalb laeuft es
     nahtlos um, und bewegt wird nur ein einziges transform — auf der
     Grafikeinheit, ohne Skript. Wichtig gerade auf dem Ladebildschirm, denn
     dort soll die Rechenzeit den Charts gehoeren, nicht der Zierde.

     Steigende Kerzen bleiben hohl, fallende sind gefuellt. So entsteht der
     Unterschied ohne eine einzige Farbe. */
  .kerzen {
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
  }
  /* Eine Kachel, nicht ein gedehntes Bild.

     Vorher stand das ganze Muster als SVG im Band und wurde auf die doppelte
     Fensterbreite gezogen. Auf dem Telefon ergab das 11 Pixel je Kerze — auf
     einem Fenster von 2000 Pixeln aber 59. Dieselbe Zeichnung, nur riesig:
     aus einem Hintergrund wurde ein Vordergrund.

     Der Grund steckte in der Bauweise: 34 Kerzen, die immer die volle Breite
     fuellen sollen, werden auf einem breiten Bildschirm eben gross. Kleiner
     gehen sie nur, wenn es mehr werden. Deshalb liegt das Muster jetzt als
     Datei daneben und wird gekachelt.

     Die Kachel ist so breit wie das Fenster, hoechstens aber 620 Pixel. Auf
     dem Telefon aendert das nichts — dort war sie schon so breit. Am
     Schreibtisch stehen drei Kacheln nebeneinander, und die Kerze ist wieder
     18 statt 59 Pixel breit. */
  .kerzen-band {
    position: absolute;
    top: 0;
    left: 0;
    --kachel: min(100vw, 620px);
    /* Ein Fenster plus eine Kachel: nach dem Weg um eine Kachel deckt das
       Band den Bildschirm immer noch ganz ab. */
    width: calc(100% + var(--kachel));
    height: 100%;
    background-image: url("/kerzen.svg?v=72");
    background-repeat: repeat-x;
    background-size: var(--kachel) 100%;
    will-change: transform;
  }
  /* Zwei Baender uebereinander: das hintere groesser, blasser und langsamer,
     das vordere kleiner, dunkler und schnell. Der Abstand dazwischen ist es,
     der das Bild lebendig macht — ein Band allein wirkt wie eine Tapete. */
  .kerzen-band.hinten {
    height: 150%;
    top: -25%;
    /* Blasser — ueber eine eigene Kachel, nicht ueber die Deckkraft des
       Bandes. Deckkraft am Element zwingt den Compositor, die ganze Ebene
       bei jedem Bild zu ueberblenden: gemessen bei sechsfach gedrosseltem
       Prozessor kostete das im Schnitt 3,0 lange Bilder je Lauf statt 0,3.
       Als zweite Datei sind es dieselben Einzelwerte wie frueher (0,16 ·
       0,17 · 0,26) und nichts zu ueberblenden. */
    background-image: url("/kerzen-blass.svg?v=72");
    animation: kerzenLauf 20.25s linear infinite;
  }
  .kerzen-band.vorn {
    height: 78%;
    top: 11%;
    animation: kerzenLauf 8.1s linear infinite;
  }

  @keyframes kerzenLauf {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(calc(var(--kachel) * -1), 0, 0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .kerzen-band { animation: none; }
  }

  .kasten {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 326px;
    /* Durchscheinend, damit die Kerzen dahinter weiterlaufen. Die Milchglas-
       Schicht haelt die Schrift trotzdem lesbar — dieselbe Machart wie bei
       der klebenden Leiste in der Liste. */
    background: rgba(255, 255, 255, 0.72);
    -webkit-backdrop-filter: saturate(130%) blur(16px);
    backdrop-filter: saturate(130%) blur(16px);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 32px 24px 26px;
    animation: riseIn 0.74s var(--ease) both;
  }

  .marke { text-align: center; margin-bottom: 26px; }
  .marke .label {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 10px;
  }
  .marke h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .marke .sub {
    font-size: 13px;
    color: var(--muted);
    margin-top: 6px;
  }

  .reiter {
    display: flex;
    border: 1px solid var(--line);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .reiter button {
    flex: 1;
    font: inherit;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--muted);
    background: var(--card);
    border: none;
    padding: 11px 6px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.27s ease, color 0.27s ease;
  }
  .reiter button + button { border-left: 1px solid var(--line); }
  .reiter button[aria-selected="true"] {
    background: var(--fg);
    color: #fff;
  }

  label.feld {
    display: block;
    margin-bottom: 14px;
  }
  /* hidden gewinnt sonst nicht gegen die Klasse */
  label.feld[hidden], .merken[hidden] { display: none; }
  label.feld > span {
    display: block;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 6px;
  }
  input[type="email"],
  input[type="password"],
  input[type="text"] {
    width: 100%;
    font: inherit;
    font-size: 16px; /* unter 16px zoomt Safari beim Tippen */
    color: var(--fg);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 11px 12px;
    transition: border-color 0.27s ease;
  }
  input:focus {
    outline: none;
    border-color: var(--fg);
  }

  .merken {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 13px;
    color: var(--muted);
    margin: 4px 0 18px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .merken input { width: 16px; height: 16px; accent-color: #111; }

  button.senden {
    width: 100%;
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 600;
    color: #fff;
    background: var(--fg);
    border: 1px solid var(--fg);
    border-radius: 2px;
    padding: 13px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transform: translateZ(0);
    transition: opacity 0.27s ease, transform 0.16s var(--ease);
  }
  button.senden:active { transform: scale(0.985); }
  button.senden[disabled] { opacity: 0.45; cursor: default; }

  .meldung {
    font-size: 13px;
    margin-top: 16px;
    min-height: 18px;
    opacity: 0;
    transform: translate3d(0, 4px, 0);
    transition: opacity 0.27s ease, transform 0.27s ease;
  }
  .meldung.zeig { opacity: 1; transform: translate3d(0, 0, 0); }
  .meldung.schlecht { color: #b91c1c; }
  .meldung.gut { color: #15803d; }

  .fuss {
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid var(--hair);
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    line-height: 1.6;
  }

  @keyframes shakeX {
    0%, 100% { transform: translate3d(0, 0, 0); }
    20% { transform: translate3d(-6px, 0, 0); }
    40% { transform: translate3d(5px, 0, 0); }
    60% { transform: translate3d(-3px, 0, 0); }
    80% { transform: translate3d(2px, 0, 0); }
  }
  .ruettel { animation: shakeX 0.54s ease; }

  @media (prefers-reduced-motion: reduce) {
    .kasten, .ruettel { animation: none; }
    * { transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<div class="kerzen" aria-hidden="true"><div class="kerzen-band hinten"></div><div class="kerzen-band vorn"></div></div>

<div class="kasten" id="kasten">
  <div class="marke">
    <div class="label">Geschützt</div>
    <h1>Aktien-Liste</h1>
    <p class="sub" id="untertitel">Anmelden mit E-Mail und Passwort</p>
  </div>

  <div class="reiter" role="tablist">
    <button type="button" id="reiterAn" role="tab" aria-selected="true">Anmelden</button>
    <button type="button" id="reiterNeu" role="tab" aria-selected="false">Zugang anfragen</button>
  </div>

  <form id="formular" autocomplete="on" novalidate>
    <label class="feld" id="feldName" hidden>
      <span>Name</span>
      <input type="text" id="name" name="name" autocomplete="name" autocapitalize="words">
    </label>

    <label class="feld">
      <span>E-Mail</span>
      <input type="email" id="mail" name="username" autocomplete="username" inputmode="email"
             autocapitalize="none" autocorrect="off" required>
    </label>

    <label class="feld">
      <span>Passwort</span>
      <input type="password" id="passwort" name="password" autocomplete="current-password" required>
    </label>

    <label class="merken" id="feldMerken">
      <input type="checkbox" id="merken" checked>
      <span>Angemeldet bleiben</span>
    </label>

    <button type="submit" class="senden" id="senden">Anmelden</button>
  </form>

  <div class="meldung" id="meldung" role="status" aria-live="polite"></div>

  <div class="fuss" id="fuss">
    Kein Konto? Zugang anfragen — die Freigabe erfolgt von Hand.
  </div>
</div>

<script>
(function () {
  var API = "/.netlify/functions/konto";

  var reiterAn = document.getElementById("reiterAn");
  var reiterNeu = document.getElementById("reiterNeu");
  var formular = document.getElementById("formular");
  var feldName = document.getElementById("feldName");
  var feldMerken = document.getElementById("feldMerken");
  var name = document.getElementById("name");
  var mail = document.getElementById("mail");
  var passwort = document.getElementById("passwort");
  var merken = document.getElementById("merken");
  var senden = document.getElementById("senden");
  var meldung = document.getElementById("meldung");
  var untertitel = document.getElementById("untertitel");
  var fuss = document.getElementById("fuss");
  var kasten = document.getElementById("kasten");

  var modus = "anmelden";

  function ziel() {
    var p = new URLSearchParams(location.search).get("ziel") || "/";
    // Nur eigene Pfade, nie eine fremde Adresse
    if (p.charAt(0) !== "/" || p.charAt(1) === "/") return "/";
    return p;
  }

  function sagen(text, gut) {
    meldung.textContent = text;
    meldung.className = "meldung zeig " + (gut ? "gut" : "schlecht");
    if (!gut && text) {
      kasten.classList.remove("ruettel");
      void kasten.offsetWidth;
      kasten.classList.add("ruettel");
      setTimeout(function () { kasten.classList.remove("ruettel"); }, 610);
    }
  }

  function leeren() {
    meldung.textContent = "";
    meldung.className = "meldung";
  }

  function wechsel(neu) {
    modus = neu;
    leeren();
    var reg = neu === "registrieren";
    reiterAn.setAttribute("aria-selected", reg ? "false" : "true");
    reiterNeu.setAttribute("aria-selected", reg ? "true" : "false");
    feldName.hidden = !reg;
    feldMerken.hidden = reg;
    senden.textContent = reg ? "Zugang anfragen" : "Anmelden";
    untertitel.textContent = reg
      ? "Ein Konto anfragen — freigegeben wird von Hand"
      : "Anmelden mit E-Mail und Passwort";
    fuss.textContent = reg
      ? "Nach der Anfrage wird das Konto freigegeben. Danach kannst du dich anmelden."
      : "Kein Konto? Zugang anfragen — die Freigabe erfolgt von Hand.";
    passwort.setAttribute("autocomplete", reg ? "new-password" : "current-password");
    passwort.value = "";
  }

  reiterAn.addEventListener("click", function () { wechsel("anmelden"); });
  reiterNeu.addEventListener("click", function () { wechsel("registrieren"); });

  formular.addEventListener("submit", function (e) {
    e.preventDefault();
    leeren();

    var daten = {
      mail: mail.value.trim(),
      passwort: passwort.value
    };
    if (modus === "registrieren") daten.name = name.value.trim();
    else daten.merken = merken.checked;

    if (!daten.mail || !daten.passwort) {
      sagen("Bitte E-Mail und Passwort ausfüllen.", false);
      return;
    }

    senden.disabled = true;
    var vorher = senden.textContent;
    senden.textContent = modus === "registrieren" ? "Wird gesendet …" : "Prüfe …";

    fetch(API + "?tat=" + modus, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify(daten)
    })
      .then(function (r) { return r.json().catch(function () { return {}; }); })
      .then(function (a) {
        senden.disabled = false;
        senden.textContent = vorher;

        if (!a || a.ok !== true) {
          sagen((a && a.fehler) || "Das hat nicht geklappt.", false);
          return;
        }

        if (modus === "registrieren") {
          sagen(a.hinweis || "Anfrage ist eingegangen.", true);
          if (a.status === "frei") setTimeout(function () { wechsel("anmelden"); }, 1400);
          return;
        }

        sagen("Angemeldet.", true);
        location.replace(ziel());
      })
      .catch(function () {
        senden.disabled = false;
        senden.textContent = vorher;
        sagen("Keine Verbindung. Noch einmal versuchen.", false);
      });
  });

  // Wer schon angemeldet ist, muss die Seite nicht sehen
  fetch(API + "?tat=wer", { credentials: "same-origin", cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (a) { if (a && a.angemeldet) location.replace(ziel()); })
    .catch(function () {});

  mail.focus();
})();
</script>
</body>
</html>
