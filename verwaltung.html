<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#fafafa">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=33">
<link rel="apple-touch-icon" href="/icon-180.png?v=33">
<title>Verwaltung · Aktien-Liste</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fafafa;
    --fg: #111111;
    --muted: #737373;
    --line: #e5e5e5;
    --soft: #f5f5f5;
    --card: #ffffff;
    --hair: #ebebeb;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 48px;
  }

  @keyframes riseIn {
    from { opacity: 0; transform: translate3d(0, 10px, 0); }
    to   { opacity: 1; transform: translate3d(0, 0, 0); }
  }

  header {
    position: relative;
    padding: 36px 24px 26px;
    text-align: center;
    background: var(--card);
    border-bottom: 1px solid var(--hair);
  }
  header .zurueck {
    position: absolute;
    top: 14px;
    left: 14px;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--muted);
    text-decoration: none;
    padding: 6px 10px 6px 4px;
    -webkit-tap-highlight-color: transparent;
  }
  header .zurueck::before { content: "‹"; margin-right: 5px; font-size: 14px; }
  header .label {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 10px;
  }
  header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
  header .sub { font-size: 13px; color: var(--muted); margin-top: 6px; }

  main { max-width: 640px; margin: 0 auto; padding: 20px 14px 0; }

  .gruppe { margin-bottom: 30px; }
  .gruppe > .titel {
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    margin: 0 4px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .gruppe > .titel .zahl {
    font-variant-numeric: tabular-nums;
    letter-spacing: 0;
    color: var(--fg);
    background: var(--soft);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 1px 6px;
  }

  .weiter {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 15px 16px;
    margin-bottom: 10px;
    text-decoration: none;
    color: var(--fg);
    -webkit-tap-highlight-color: transparent;
    transition: background 0.18s ease;
  }
  .weiter:active { background: var(--soft); }
  .weiter .was { font-size: 14px; font-weight: 600; }
  .weiter .wie { flex: 1; font-size: 12px; color: var(--muted); }
  .weiter .pfeil { color: var(--muted); font-size: 15px; }
  @media (max-width: 420px) {
    .weiter { flex-wrap: wrap; }
    .weiter .wie { flex-basis: 100%; }
    .weiter .pfeil { position: absolute; right: 22px; }
  }

  /* Nachricht an alle */
  .senden {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 16px;
    margin-bottom: 30px;
    animation: riseIn 0.4s var(--ease) both;
  }
  .senden .titel {
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 12px;
  }
  .senden input,
  .senden textarea {
    display: block;
    width: 100%;
    font: inherit;
    font-size: 16px; /* unter 16px zoomt Safari beim Tippen */
    color: var(--fg);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 10px 12px;
    margin-bottom: 10px;
    resize: none;
    transition: border-color 0.2s ease;
  }
  .senden input:focus,
  .senden textarea:focus { outline: none; border-color: var(--fg); }
  .senden .reihe {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 4px;
  }
  .senden .zahl { font-size: 12px; color: var(--muted); }
  .senden button {
    font: inherit;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 600;
    color: #fff;
    background: var(--fg);
    border: 1px solid var(--fg);
    border-radius: 2px;
    padding: 10px 18px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transform: translateZ(0);
    transition: opacity 0.2s ease, transform 0.12s var(--ease);
  }
  .senden button:active { transform: scale(0.97); }
  .senden button[disabled] { opacity: 0.4; cursor: default; }
  .senden .ergebnis {
    font-size: 12px;
    margin-top: 10px;
    min-height: 16px;
  }
  .senden .ergebnis.gut { color: #15803d; }
  .senden .ergebnis.schlecht { color: #b91c1c; }

  /* Wer gerade da ist */
  .jetzt {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 16px;
    margin-bottom: 30px;
    animation: riseIn 0.4s var(--ease) both;
  }
  .jetzt > .titel {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .jetzt > .titel .zahl {
    font-variant-numeric: tabular-nums;
    letter-spacing: 0;
    color: var(--fg);
    background: var(--soft);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 1px 6px;
  }

  /* Der Punkt schlaegt langsam — das unterscheidet "jetzt" von "zuletzt",
     ohne dass eine Farbe noetig waere. */
  .punkt {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--fg);
    animation: pulsen 2.4s ease-in-out infinite;
  }
  @keyframes pulsen {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.2; }
  }

  .person {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 11px 0 10px;
    border-top: 1px solid var(--hair);
  }
  .person:first-child { border-top: 0; padding-top: 8px; }
  .person > .punkt { flex: none; margin-top: 6px; }
  .person .wer { flex: 1; min-width: 0; }
  .person .nam { font-size: 14px; font-weight: 600; }
  .person .adr { font-size: 11px; color: var(--muted); word-break: break-all; }
  .person .wann {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
    white-space: nowrap;
    padding-top: 2px;
  }

  .konto {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 14px 16px;
    margin-bottom: 10px;
    animation: riseIn 0.4s var(--ease) both;
  }
  .konto .zeile .punkt { margin-right: 6px; }
  .konto .kopf {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .konto .mail { font-size: 14px; font-weight: 600; word-break: break-all; }
  .konto .rolle {
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 600;
    color: #fff;
    background: var(--fg);
    border-radius: 2px;
    padding: 2px 6px;
  }
  .konto .zeile {
    font-size: 12px;
    color: var(--muted);
    margin-top: 5px;
  }
  .konto .knoepfe {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .konto button {
    font: inherit;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--fg);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 8px 12px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transform: translateZ(0);
    transition: background 0.18s ease, border-color 0.18s ease, transform 0.12s var(--ease);
  }
  .konto button:active { transform: scale(0.96); }
  .konto button.stark { background: var(--fg); color: #fff; border-color: var(--fg); }
  .konto button.rot { color: #b91c1c; border-color: #f0d0d0; }
  .konto button[disabled] { opacity: 0.4; cursor: default; }

  .leer {
    font-size: 13px;
    color: var(--muted);
    padding: 14px 4px;
  }

  .meldung {
    max-width: 640px;
    margin: 0 auto 16px;
    padding: 0 18px;
    font-size: 13px;
    min-height: 18px;
  }
  .meldung.schlecht { color: #b91c1c; }
  .meldung.gut { color: #15803d; }

  .fuss {
    max-width: 640px;
    margin: 10px auto 0;
    padding: 18px 18px 0;
    border-top: 1px solid var(--hair);
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    line-height: 1.8;
  }
  .fuss a { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--line); }

  @media (prefers-reduced-motion: reduce) {
    .konto, .jetzt, .senden { animation: none; }
    .punkt { animation: none; }
    * { transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<header>
  <a class="zurueck" href="/">Zur Liste</a>
  <div class="label">Verwaltung</div>
  <h1>Zugänge</h1>
  <p class="sub" id="untertitel">wird geladen …</p>
</header>

<div class="meldung" id="meldung"></div>

<main>
  <section class="jetzt" id="jetztKasten">
    <div class="titel">Gerade auf der Seite <span class="zahl" id="jetztZahl">–</span></div>
    <div id="jetztListe"><div class="leer">wird geladen …</div></div>
  </section>

  <a class="weiter" href="/positionen.html">
    <span class="was">Positionen</span>
    <span class="wie">Symbole hinzufügen, ändern, sortieren</span>
    <span class="pfeil">›</span>
  </a>

  <section class="senden" id="sendeKasten" hidden>
    <div class="titel">Nachricht an alle</div>
    <input type="text" id="nTitel" maxlength="60" placeholder="Titel" autocomplete="off">
    <textarea id="nText" maxlength="300" rows="3" placeholder="Text"></textarea>
    <div class="reihe">
      <span class="zahl" id="nZahl">Geräte werden gezählt …</span>
      <button type="button" id="nSenden" disabled>Senden</button>
    </div>
    <div class="ergebnis" id="nErgebnis"></div>
  </section>

  <div id="inhalt"></div>
</main>

<div class="fuss">
  <a href="/">Zurück zur Liste</a> · <a href="#" id="abmelden">Abmelden</a>
</div>

<script>
(function () {
  var API = "/.netlify/functions/konto";
  var inhalt = document.getElementById("inhalt");
  var meldung = document.getElementById("meldung");
  var untertitel = document.getElementById("untertitel");

  var TITEL = { wartet: "Wartet auf Freigabe", frei: "Freigegeben", gesperrt: "Gesperrt" };

  function sagen(text, gut) {
    meldung.textContent = text || "";
    meldung.className = "meldung " + (text ? (gut ? "gut" : "schlecht") : "");
  }

  function datum(iso) {
    if (!iso) return "–";
    var d = new Date(iso);
    if (isNaN(d)) return "–";
    return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "2-digit" }) +
      " " + d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  }

  function tat(pfad, daten) {
    return fetch(API + "?tat=" + pfad, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify(daten || {})
    }).then(function (r) { return r.json().catch(function () { return {}; }); });
  }

  function knopf(text, klasse, fn) {
    var b = document.createElement("button");
    b.textContent = text;
    if (klasse) b.className = klasse;
    b.addEventListener("click", function () {
      b.disabled = true;
      fn().then(function (a) {
        if (a && a.ok) { sagen("", true); laden(); }
        else { b.disabled = false; sagen((a && a.fehler) || "Das hat nicht geklappt.", false); }
      }).catch(function () {
        b.disabled = false;
        sagen("Keine Verbindung.", false);
      });
    });
    return b;
  }

  function karte(k, ich) {
    var d = document.createElement("div");
    d.className = "konto";

    var kopf = document.createElement("div");
    kopf.className = "kopf";
    var m = document.createElement("div");
    m.className = "mail";
    m.textContent = k.mail;
    kopf.appendChild(m);
    if (k.rolle === "chef") {
      var r = document.createElement("span");
      r.className = "rolle";
      r.textContent = "Verwaltung";
      kopf.appendChild(r);
    }
    d.appendChild(kopf);

    var z1 = document.createElement("div");
    z1.className = "zeile";
    z1.textContent = (k.name ? k.name + " · " : "") + "angefragt " + datum(k.erstellt);
    d.appendChild(z1);

    var z2 = document.createElement("div");
    z2.className = "zeile";
    z2.textContent = "zuletzt angemeldet " + datum(k.zuletzt) +
      (k.gesperrt_bis ? " · vorübergehend gesperrt bis " + datum(k.gesperrt_bis) : "");
    d.appendChild(z2);

    // Anmelden ist das eine, offen haben das andere — deshalb eine eigene Zeile
    var z3 = document.createElement("div");
    z3.className = "zeile";
    zeilen[k.mail] = z3;
    besuchZeile(k.mail);
    d.appendChild(z3);

    if (k.mail === ich) return d;

    var kn = document.createElement("div");
    kn.className = "knoepfe";

    if (k.status !== "frei") {
      kn.appendChild(knopf("Freigeben", "stark", function () {
        return tat("entscheiden", { mail: k.mail, status: "frei" });
      }));
    }
    if (k.status !== "gesperrt") {
      // Wer noch wartet, wird abgelehnt; wer schon drin war, wird gesperrt
      kn.appendChild(knopf(k.status === "wartet" ? "Ablehnen" : "Sperren", "", function () {
        return tat("entscheiden", { mail: k.mail, status: "gesperrt" });
      }));
    }
    kn.appendChild(knopf("Löschen", "rot", function () {
      if (!confirm("Konto " + k.mail + " endgültig löschen?")) return Promise.resolve({ ok: false, fehler: "" });
      return tat("loeschen", { mail: k.mail });
    }));

    d.appendChild(kn);
    return d;
  }

  function laden() {
    fetch(API + "?tat=liste", { credentials: "same-origin", cache: "no-store" })
      .then(function (r) {
        if (r.status === 403) { location.replace("/"); return null; }
        if (r.status === 401) { location.replace("/anmelden.html?ziel=%2Fverwaltung.html"); return null; }
        return r.json();
      })
      .then(function (a) {
        if (!a) return;
        if (!a.ok) { sagen(a.fehler || "Das hat nicht geklappt.", false); return; }

        kontenZahl = a.konten.length;
        untertitelSchreiben();
        zeilen = {};
        inhalt.textContent = "";

        ["wartet", "frei", "gesperrt"].forEach(function (status) {
          var teil = a.konten.filter(function (k) { return k.status === status; });
          if (!teil.length && status !== "wartet") return;

          var g = document.createElement("div");
          g.className = "gruppe";

          var t = document.createElement("div");
          t.className = "titel";
          t.appendChild(document.createTextNode(TITEL[status]));
          var zahl = document.createElement("span");
          zahl.className = "zahl";
          zahl.textContent = teil.length;
          t.appendChild(zahl);
          g.appendChild(t);

          if (!teil.length) {
            var leer = document.createElement("div");
            leer.className = "leer";
            leer.textContent = "Keine offenen Anfragen.";
            g.appendChild(leer);
          } else {
            teil.forEach(function (k) { g.appendChild(karte(k, a.ich)); });
          }

          inhalt.appendChild(g);
        });
      })
      .catch(function () { sagen("Keine Verbindung.", false); });
  }

  /* ---------- Wer gerade da ist, und wer zuletzt ---------- */

  var API3 = "/.netlify/functions/besuch";
  var jetztKasten = document.getElementById("jetztKasten");
  var jetztZahl = document.getElementById("jetztZahl");
  var jetztListe = document.getElementById("jetztListe");

  var praesenz = {};    // mail -> was der Server ueber diese Person sagt
  var zeilen = {};      // mail -> die Besuchszeile in ihrer Kontokarte
  var bezug = 0;        // Serverzeit des letzten Abrufs; gegen falsch gehende Uhren
  var daZahl = 0;
  var kontenZahl = null;

  function untertitelSchreiben() {
    if (kontenZahl === null) return;
    untertitel.textContent =
      (kontenZahl === 1 ? "1 Konto" : kontenZahl + " Konten") +
      " · " + (daZahl ? daZahl + " gerade da" : "niemand gerade da");
  }

  /* Wie lange ist das her */
  function her(iso) {
    var t = Date.parse(iso || "");
    if (!t) return null;
    var s = Math.max(0, Math.round((bezug - t) / 1000));
    if (s < 90) return "gerade eben";
    var m = Math.round(s / 60);
    if (m < 60) return "vor " + m + " Minuten";
    var h = Math.round(m / 60);
    if (h < 24) return "vor " + h + (h === 1 ? " Stunde" : " Stunden");
    var tg = Math.round(h / 24);
    if (tg < 8) return "vor " + tg + (tg === 1 ? " Tag" : " Tagen");
    return "am " + datum(iso);
  }

  /* Wie lange schon */
  function schon(iso) {
    var t = Date.parse(iso || "");
    if (!t) return "";
    var m = Math.round((bezug - t) / 60000);
    if (m < 2) return "seit gerade eben";
    if (m < 60) return "seit " + m + " Minuten";
    var h = Math.floor(m / 60);
    return "seit " + h + (h === 1 ? " Stunde" : " Stunden");
  }

  function geraeteDa(p) {
    var arten = [];
    (p.geraete || []).forEach(function (g) {
      if (g.da && arten.indexOf(g.art) < 0) arten.push(g.art);
    });
    return arten.join(" + ");
  }

  function punkt() {
    var s = document.createElement("span");
    s.className = "punkt";
    return s;
  }

  function besuchZeile(mail) {
    var z = zeilen[mail];
    if (!z) return;
    var p = praesenz[mail];
    z.textContent = "";

    if (p && p.da) {
      z.appendChild(punkt());
      z.appendChild(document.createTextNode(
        "jetzt auf der Seite · " + (geraeteDa(p) || "Gerät") + " · " + schon(p.seit)
      ));
    } else if (p && p.zuletzt) {
      z.appendChild(document.createTextNode(
        "auf der Seite " + her(p.zuletzt) +
        (p.geraete && p.geraete[0] ? " · " + p.geraete[0].art : "")
      ));
    } else {
      z.appendChild(document.createTextNode("noch nie auf der Seite"));
    }
  }

  function personZeile(p) {
    var d = document.createElement("div");
    d.className = "person";
    d.appendChild(punkt());

    var wer = document.createElement("div");
    wer.className = "wer";
    var nam = document.createElement("div");
    nam.className = "nam";
    nam.textContent = p.name || p.mail;
    wer.appendChild(nam);
    if (p.name) {
      var adr = document.createElement("div");
      adr.className = "adr";
      adr.textContent = p.mail;
      wer.appendChild(adr);
    }
    d.appendChild(wer);

    var wann = document.createElement("div");
    wann.className = "wann";
    wann.appendChild(document.createTextNode(geraeteDa(p) || "Gerät"));
    wann.appendChild(document.createElement("br"));
    wann.appendChild(document.createTextNode(schon(p.seit)));
    d.appendChild(wann);

    return d;
  }

  function besuchLaden() {
    fetch(API3, { credentials: "same-origin", cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (a) {
        if (!a || !a.ok) { jetztKasten.hidden = true; return; }
        jetztKasten.hidden = false;

        bezug = Date.parse(a.jetzt) || Date.now();
        praesenz = {};
        a.leute.forEach(function (p) { praesenz[p.mail] = p; });

        var da = a.leute.filter(function (p) { return p.da; });
        daZahl = da.length;
        jetztZahl.textContent = daZahl;

        jetztListe.textContent = "";
        if (!da.length) {
          var leer = document.createElement("div");
          leer.className = "leer";
          leer.textContent = "Gerade ist niemand da.";
          jetztListe.appendChild(leer);
        } else {
          da.forEach(function (p) { jetztListe.appendChild(personZeile(p)); });
        }

        Object.keys(zeilen).forEach(function (mail) { besuchZeile(mail); });
        untertitelSchreiben();
      })
      .catch(function () {});
  }

  besuchLaden();
  setInterval(function () {
    if (document.visibilityState === "visible") besuchLaden();
  }, 20000);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") besuchLaden();
  });
  // Sobald diese Seite sich selbst gemeldet hat, gleich noch einmal nachsehen
  document.addEventListener("rcp:besuch", besuchLaden);

  /* ---------- Nachricht an alle ---------- */

  (function () {
    var API2 = "/.netlify/functions/nachricht";
    var kasten = document.getElementById("sendeKasten");
    var titel = document.getElementById("nTitel");
    var text = document.getElementById("nText");
    var zahl = document.getElementById("nZahl");
    var knopf = document.getElementById("nSenden");
    var ergebnis = document.getElementById("nErgebnis");
    var geraete = 0;

    function wieViele(n) {
      return n === 1 ? "1 Gerät" : n + " Geräte";
    }

    function zeigen(text2, gut) {
      ergebnis.textContent = text2 || "";
      ergebnis.className = "ergebnis " + (text2 ? (gut ? "gut" : "schlecht") : "");
    }

    function zaehlen() {
      fetch(API2, { credentials: "same-origin", cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (a) {
          if (!a || !a.ok) return;
          kasten.hidden = false;
          geraete = a.geraete || 0;
          zahl.textContent = geraete
            ? "Geht an " + wieViele(geraete)
            : "Noch kein Gerät angemeldet";
          knopf.disabled = geraete === 0;
        })
        .catch(function () {});
    }

    knopf.addEventListener("click", function () {
      // Erst aufraeumen: eine alte Meldung darf nach einem Abbruch nicht stehenbleiben
      zeigen("", true);

      var t = titel.value.trim();
      var b = text.value.trim();
      if (!t && !b) { zeigen("Titel oder Text ausfüllen.", false); return; }
      if (!confirm("Nachricht an " + wieViele(geraete) + " senden?")) return;

      knopf.disabled = true;
      var vorher = knopf.textContent;
      knopf.textContent = "Sendet …";

      fetch(API2, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({ titel: t, text: b })
      })
        .then(function (r) { return r.json().catch(function () { return {}; }); })
        .then(function (a) {
          knopf.disabled = false;
          knopf.textContent = vorher;
          if (!a || !a.ok) {
            zeigen((a && a.fehler) || "Das hat nicht geklappt.", false);
            return;
          }
          zeigen(
            "An " + wieViele(a.gesendet) + " gesendet." +
              (a.weg ? " " + a.weg + " abgemeldete entfernt." : ""),
            true
          );
          titel.value = "";
          text.value = "";
          zaehlen();
        })
        .catch(function () {
          knopf.disabled = false;
          knopf.textContent = vorher;
          zeigen("Keine Verbindung.", false);
        });
    });

    zaehlen();
  })();

  document.getElementById("abmelden").addEventListener("click", function (e) {
    e.preventDefault();
    tat("abmelden").then(function () { location.replace("/anmelden.html"); });
  });

  laden();
})();
</script>
<script src="/besuch.js" defer></script>
</body>
</html>
